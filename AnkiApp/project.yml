name: AnkiApp
options:
  bundleIdPrefix: com.ankiapp
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    SWIFT_OBJC_INTEROP_MODE: objcxx
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  AnkiBridge:
    path: ..
  AmgiUI:
    path: ../AmgiUI
  AmgiReader:
    path: ../AmgiReader
schemes:
  AnkiApp:
    build:
      targets:
        AnkiApp: all
        AmgiWidget: all
    run:
      config: Debug
targets:
  AnkiApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/*Tests.swift"
          - "Widgets"
      - path: Resources
        excludes:
          - "mathjax/**"
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/mathjax
        buildPhase: resources
        type: folder
    dependencies:
      - package: AnkiBridge
        product: AnkiKit
      - package: AnkiBridge
        product: AnkiServices
      - package: AmgiReader
        product: AmgiReader
      - package: AmgiReader
        product: AmgiReaderDictionary
      - package: AnkiBridge
        product: AnkiClients
      - package: AnkiBridge
        product: AmgiCardWeb
      - package: AnkiBridge
        product: AnkiSync
      - package: AnkiBridge
        product: AnkiBackend
      - package: AnkiBridge
        product: AnkiProto
      - package: AmgiUI
        product: AmgiTheme
      - sdk: WidgetKit.framework
      - target: AmgiWidget
        embed: true
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ankiapp.AnkiApp
        CODE_SIGN_ENTITLEMENTS: AmgiApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  AmgiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widgets
      - path: Sources/Shared/WidgetSnapshot.swift
      - path: Sources/Shared/WidgetSnapshotStore.swift
    dependencies:
      - package: AnkiBridge
        product: AnkiKit
      - package: AmgiUI
        product: AmgiTheme
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ankiapp.AnkiApp.widget
        INFOPLIST_FILE: Sources/Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: AmgiWidget.entitlements
